; ESP32-C3 fake ELRS backpack for bench testing.
;
; Build:  ./tools/pio run -d sim -e esp32-c3
; Flash:  ./tools/pio run -d sim -e esp32-c3 -t upload --upload-port <port>

[env:esp32-c3]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600

lib_extra_dirs = ../firmware/lib

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DELRS_CHANNEL=1
    -DSIM_GPS_LAT=55.753930
    -DSIM_GPS_LON=37.620795
    -DSIM_GPS_RADIUS_M=120.0
    -DSIM_GPS_SPEED_KMH=18.0

[env:esp32-c3-lr]
extends = env:esp32-c3
build_flags =
    ${env:esp32-c3.build_flags}
    -DELRS_PHY_LR=1
