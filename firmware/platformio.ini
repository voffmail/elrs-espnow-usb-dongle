; ELRS ESP-NOW USB dongle — ESP32-C3 firmware
;
; Local toolchain:
;   ./init.sh
;   ./tools/pio run -d firmware -e esp32-c3
;   ./tools/pio run -d firmware -e esp32-c3 -t upload --upload-port /dev/ttyUSB0
;
; Data is written to Serial0 (UART0 -> CP2102N -> phone).
; Debug logs go to Serial (native USB CDC, optional connector).

[env:esp32-c3]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DELRS_CHANNEL=1
    -DELRS_UART_BAUD=115200
    ; For bring-up logs on native USB, add:
    ; -DELRS_DEBUG_SERIAL=1

build_unflags =

[env:esp32-c3-usb]
; Native USB CDC C3 boards used on the bench. Data and config share Serial.
extends = env:esp32-c3
build_flags =
    ${env:esp32-c3.build_flags}
    -DELRS_DATA_USB=1

[env:esp32-c3-lr]
; Optional LR PHY for real backpacks that require 802.11 LR. On the C3 bench
; LR showed packet loss, so the default envs use BGN only.
extends = env:esp32-c3
build_flags =
    ${env:esp32-c3.build_flags}
    -DELRS_PHY_LR=1

[env:esp32-c3-usb-lr]
extends = env:esp32-c3-usb
build_flags =
    ${env:esp32-c3-usb.build_flags}
    -DELRS_PHY_LR=1
